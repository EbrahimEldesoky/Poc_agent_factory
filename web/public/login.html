<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Agent Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="login-body">
  <form class="login-card" id="login">
    <div class="brand dark"><span class="logo">AF</span> Agent Factory</div>
    <h1>Sign in</h1>
    <label>Email<input name="email" type="email" autocomplete="username" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <p class="error" id="err" hidden></p>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
<script src="/login.js"></script>
</body>
</html>
