server {
  listen 80;
  root /usr/share/nginx/html;
  access_log off;
  resolver 127.0.0.11 valid=10s;
  location /api/ {
    set $api http://api:8000;
    proxy_pass $api;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
  }
  location = /login { try_files /login.html =404; }
  location / { try_files $uri /index.html; }
}
