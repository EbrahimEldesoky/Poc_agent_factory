server {
  listen 8080;
  root /usr/share/nginx/html;
  access_log off;
  resolver 127.0.0.11 valid=10s;
  location /api/ {
    set $api http://api:8000;
    proxy_pass $api;
    proxy_read_timeout 120s;
    proxy_set_header Host $http_host;  # keep host:port so the API same-origin check matches the browser Origin
  }
  # Always revalidate the page and scripts so a rebuild is picked up without a hard refresh.
  location = /login { add_header Cache-Control "no-cache"; try_files /login.html =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
