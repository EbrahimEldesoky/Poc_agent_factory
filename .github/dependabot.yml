# Keeps pinned dependencies current: each bump arrives as a PR that must pass the full CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/api, /broker, /web, /egress]
    schedule: { interval: weekly }
